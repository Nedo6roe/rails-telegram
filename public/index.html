<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рельсы и дороги</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#dfe9f2;--paper:#f6fafd;--ink:#1d2a36;--mut:#5d7183;--acc:#c4533d;--ok:#2f8f5b;--line:#9db4c7}
@media (prefers-color-scheme:dark){:root{--bg:#14202b;--paper:#1c2b39;--ink:#e6eef5;--mut:#93a8ba;--acc:#e0705a;--ok:#4cc486;--line:#3a5166}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Trebuchet MS",Verdana,sans-serif;padding:max(10px,env(safe-area-inset-top)) 10px max(10px,env(safe-area-inset-bottom));display:flex;justify-content:center}
.wrap{width:100%;max-width:460px}.view{display:none}
h1{font-size:18px;margin:2px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
h1 span{font-size:14px;color:var(--mut);font-weight:normal}
#board,#tray,#sp,#tbl{--paper:#eaf2f9}
#board{display:grid;grid-template-columns:22px repeat(7,1fr) 22px;grid-template-rows:22px repeat(7,1fr) 22px;background:radial-gradient(ellipse at 15% 10%,#f4f9fd,transparent 50%),radial-gradient(ellipse at 85% 80%,#9fc3df,transparent 55%),#c9deee;border-radius:14px;padding:6px;aspect-ratio:1}
.c{position:relative;border:1px solid rgba(30,50,70,.28);overflow:hidden;min-width:0;min-height:0}
.c svg,.x svg{display:block;width:100%;height:100%}.x{min-width:0;min-height:0}
.c.bt{border-top:3px solid #111}.c.bb{border-bottom:3px solid #111}.c.bl{border-left:3px solid #111}.c.br{border-right:3px solid #111}
.c.mt{border-top:2px solid #c4533d}.c.mb{border-bottom:2px solid #c4533d}.c.ml{border-left:2px solid #c4533d}.c.mr{border-right:2px solid #c4533d}
.c.ok::after{content:"";position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--ok);opacity:.6}
.c.gok{outline:3px solid var(--ok);outline-offset:-3px}.c.gbad{outline:3px solid var(--acc);outline-offset:-3px;background:rgba(196,83,61,.2)}.c.gok::after,.c.gbad::after{display:none}
#board.b3{display:block;position:relative;padding:0;background:#bfd9ee;overflow:hidden;touch-action:none}
#tray,#sp{display:flex;gap:8px;margin:8px 0}#sp{gap:6px;margin-top:0}
.d{flex:1;aspect-ratio:1;min-width:0;background:var(--paper);border:2px solid #222;border-radius:8px;padding:0;cursor:pointer;overflow:hidden}
.d svg{width:100%;height:100%;display:block}.d.sel{border-color:#c4533d;box-shadow:0 0 0 2px #c4533d}.d.used{opacity:.25}
#sp .d{border-width:1px;border-radius:6px}
#spl{font-size:12px;color:var(--mut);margin:6px 0 4px}
.row{display:flex;gap:8px;margin-bottom:8px}
button.b{flex:1;font:inherit;font-size:15px;padding:11px 4px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;touch-action:manipulation}
button.b.main{background:var(--acc);border-color:var(--acc);color:#fff}button.b:disabled{opacity:.4}
#msg,#err{min-height:30px;font-size:13px;color:var(--acc);margin:2px 0}
#sc,.box{background:var(--paper);border-radius:10px;padding:8px 12px;font-size:14px;margin-bottom:8px}
#sc div{display:flex;justify-content:space-between;padding:2px 0}
#sc .t{border-top:1px solid var(--line);margin-top:4px;padding-top:6px;font-weight:bold;font-size:17px}
#tbl{display:grid;grid-template-columns:repeat(11,1fr);font-size:12px;text-align:center;margin-top:8px;background:#eaf2f9;color:#222;border:1px solid #6b7f90;border-radius:6px;overflow:hidden}
#pl{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;margin-bottom:6px}
#pl span,.pp span{padding:3px 9px;border-radius:12px;background:var(--paper);border:1px solid var(--line)}#pl .dn{color:var(--ok);border-color:var(--ok)}
.pp{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.in{width:100%;font:inherit;font-size:16px;padding:10px;margin-bottom:8px;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);text-transform:uppercase}
.code{font-size:34px;letter-spacing:6px;text-align:center;font-weight:bold;margin:6px 0}
#wait{display:none}
table{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0 14px}th,td{padding:7px 3px;text-align:right;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}tr.me td{font-weight:bold;color:var(--acc)}
</style></head><body><div class="wrap">

<div class="view" id="v-home">
  <h1>Рельсы и дороги</h1>
  <p>Игра для 1–5 человек. У каждого своё поле, фишки у всех одинаковые. Всего 7 раундов.</p>
  <div class="row"><button class="b main" id="mk">Создать игру</button></div>
  <p>Или войдите по коду друга:</p>
  <div class="row"><input class="in" id="cd" maxlength="4" placeholder="Код"><button class="b" id="jn" style="flex:0 0 40%">Войти</button></div>
  <div id="err"></div>
</div>

<div class="view" id="v-lobby">
  <h1>Ожидание игроков</h1>
  <div class="code" id="lc"></div>
  <div class="pp" id="lp"></div>
  <div class="row"><button class="b" id="inv">Пригласить друзей</button></div>
  <div class="row"><button class="b main" id="st">Начать игру</button></div>
  <div id="lw" style="font-size:13px;color:var(--mut)"></div>
</div>

<div class="view" id="v-game">
  <h1>Рельсы и дороги <span id="rd"></span></h1>
  <div id="pl"></div>
  <div id="board"></div>
  <div id="msg"></div>
  <div id="tray"></div>
  <div id="spl"></div>
  <div id="sp"></div>
  <div class="row"><button class="b" id="rot">Повернуть</button><button class="b" id="flip">Отразить</button><button class="b main" id="place">Поставить</button></div>
  <div class="row"><button class="b" id="undo">Отмена</button><button class="b main" id="next">Подтвердить раунд</button></div>
  <div class="row" id="endrow" style="display:none"><button class="b" id="endm">Завершить матч</button></div>
  <div class="box" id="wait"><div id="wt"></div><div class="row" style="margin:8px 0 0"><button class="b" id="skip">Не ждать остальных</button></div></div>
  <div id="sc"></div>
  <div id="tbl"></div>
</div>

<div class="view" id="v-end">
  <h1>Итоги</h1>
  <p id="win"></p>
  <table id="rt"></table>
  <div class="row"><button class="b main" id="again">Новая игра</button></div>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/game.js"></script>
<script>
// Объёмное поле и 3D-город (Three.js). Если что-то не работает, игра сама вернётся к плоскому полю.
function make3D(el){
if(!window.THREE)return null;
try{
const T=THREE,N=7;
const renderer=new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
const cv=renderer.domElement;cv.style.cssText='display:block;width:100%;height:100%;touch-action:none';
el.appendChild(cv);el.classList.add('b3');
const scene=new T.Scene();scene.background=new T.Color(0x070d1f);scene.fog=new T.Fog(0x0b1530,22,64);
const cam=new T.PerspectiveCamera(42,1,0.1,220);
let az=0,pol=0.95,dist=18;
const place=()=>{cam.position.set(dist*Math.sin(pol)*Math.sin(az),dist*Math.cos(pol),dist*Math.sin(pol)*Math.cos(az));cam.lookAt(0,0,0)};
scene.add(new T.HemisphereLight(0x8fb0ff,0x2a3a55,0.6));
const sun=new T.DirectionalLight(0xc8d8ff,0.35);sun.position.set(-6,12,8);scene.add(sun);
const lg=new T.DirectionalLight(0x3dffa0,0.9);lg.position.set(-9,6,-7);scene.add(lg);
const lv=new T.DirectionalLight(0xa070ff,0.7);lv.position.set(9,5,7);scene.add(lv);
const need=()=>{};

const M=c=>new T.MeshLambertMaterial({color:c});
const mat={slab:M(0xdde7ee),cell:M(0xf2f6f9),mid:M(0xe2ecf3),asp:new T.MeshStandardMaterial({color:0x2b3138,roughness:0.35,metalness:0.25}),line:M(0xf4f4f0),bal:M(0xb8b2a4),rail:new T.MeshStandardMaterial({color:0x8a9098,roughness:0.3,metalness:0.6}),tie:M(0x6d4b30),st:M(0x3d6fa8),roof:M(0xc4533d),pil:M(0x8a949c),red:M(0xc4533d),ground:M(0x727b84),grass:M(0x8fb38a),trunk:M(0x6d4b30),leaf:M(0x4f8a52),
 ok:new T.MeshBasicMaterial({color:0x2f8f5b,transparent:true,opacity:0.55}),bad:new T.MeshBasicMaterial({color:0xc4533d,transparent:true,opacity:0.55}),hint:new T.MeshBasicMaterial({color:0x2f8f5b,transparent:true,opacity:0.5})};
const gc=new Map();
const geo=(w,h,d)=>{const k=w+','+h+','+d;let g=gc.get(k);if(!g){g=new T.BoxGeometry(w,h,d);gc.set(k,g)}return g};
const box=(w,h,d,m,x,y,z)=>{const o=new T.Mesh(geo(w,h,d),m);o.position.set(x,y,z);return o};
const DX=[0,1,0,-1],DZ=[-1,0,1,0];
function leg(g,d,w,h,off,len,m,y){const cx=DX[d]*(off+len/2),cz=DZ[d]*(off+len/2);g.add(d%2===0?box(w,h,len,m,cx,y,cz):box(len,h,w,m,cx,y,cz))}

const tc=new Map();
function tileTpl(e,st){
  const k=e.join('')+(st?'s':'');let t=tc.get(k);if(t)return t;
  const g=new T.Group();
  const over=!!e[0]&&!!e[1]&&e[0]!==e[1]&&e[0]===e[2]&&e[1]===e[3];
  const hasR=e.includes(1),hasL=e.includes(2),ry=0.085;
  for(let d=0;d<4;d++){
    if(e[d]===2){
      leg(g,d,0.3,0.04,0,0.5,mat.bal,0.08);
      for(const s of[-1,1]){const o=s*0.08;g.add(d%2===0?box(0.025,0.03,0.5,mat.rail,o,0.115,DZ[d]*0.25):box(0.5,0.03,0.025,mat.rail,DX[d]*0.25,0.115,o))}
      for(let i=0;i<4;i++){const p=0.07+i*0.12;g.add(d%2===0?box(0.2,0.025,0.04,mat.tie,0,0.105,DZ[d]*p):box(0.04,0.025,0.2,mat.tie,DX[d]*p,0.105,0))}}
    if(e[d]===1){
      const off=over?0.3:0,len=over?0.2:0.5;
      leg(g,d,0.44,0.05,off,len,mat.asp,ry);
      for(let i=0;i<2;i++){const p=0.12+i*0.22;if(over&&p<0.3)continue;g.add(d%2===0?box(0.03,0.01,0.1,mat.line,0,ry+0.03,DZ[d]*p):box(0.1,0.01,0.03,mat.line,DX[d]*p,ry+0.03,0))}}}
  if(hasL)g.add(box(0.3,0.04,0.3,mat.bal,0,0.08,0));
  if(over){
    const zAxis=e[0]===1,a=Math.atan(0.115/0.1);
    g.add(zAxis?box(0.44,0.05,0.4,mat.asp,0,0.2,0):box(0.4,0.05,0.44,mat.asp,0,0.2,0));
    for(const s of[-1,1]){
      const r=zAxis?box(0.44,0.05,0.152,mat.asp,0,0.1425,s*0.25):box(0.152,0.05,0.44,mat.asp,s*0.25,0.1425,0);
      if(zAxis)r.rotation.x=s*a;else r.rotation.z=-s*a;g.add(r)}
    for(const sx of[-1,1])for(const sz of[-1,1])g.add(box(0.05,0.18,0.05,mat.pil,sx*0.17,0.1,sz*0.17));
  }else if(hasR)g.add(box(0.44,0.05,0.44,mat.asp,0,ry,0));
  if(hasR&&hasL&&!over){g.add(box(0.3,0.2,0.3,mat.st,0,0.18,0));g.add(box(0.36,0.04,0.36,mat.roof,0,0.3,0))}
  tc.set(k,g);return g}

const stat=new T.Group(),dyn=new T.Group();scene.add(stat,dyn);
stat.add(box(9.4,0.3,9.4,mat.slab,0,-0.15,0));
for(let r=-1;r<=N;r++)for(let c=-1;c<=N;c++){const mid=r>=2&&r<=4&&c>=2&&c<=4;stat.add(box(0.96,0.06,0.96,mid?mat.mid:mat.cell,c-3,0.03,r-3))}
for(const s of[-1,1]){stat.add(box(3.05,0.03,0.05,mat.red,0,0.075,s*1.5));stat.add(box(0.05,0.03,3.05,mat.red,s*1.5,0.075,0))}
const exitAt=(r,c,d)=>{if((d===0&&r===0||d===2&&r===N-1)&&c%2===1)return[1,2,1][(c-1)/2];if((d===3&&c===0||d===1&&c===N-1)&&r%2===1)return[2,1,2][(r-1)/2];return 0};
function exitMark(r,c,e,dx,dz){const g=tileTpl(e,0).clone();g.position.set(c-3,0.0,r-3);stat.add(g);
  const m=box(0.2,0.05,0.2,mat.red,c-3+dx*0.3,0.13,r-3+dz*0.3);m.rotation.y=Math.PI/4;stat.add(m)}
for(let c=1;c<N;c+=2){exitMark(-1,c,[0,0,exitAt(0,c,0),0],0,-1);exitMark(N,c,[exitAt(N-1,c,2),0,0,0],0,1)}
for(let r=1;r<N;r+=2){exitMark(r,-1,[0,exitAt(r,0,3),0,0],-1,0);exitMark(r,N,[0,0,0,exitAt(r,N-1,1)],1,0)}

// ночной лес, северное сияние, избушки и звёзды вокруг поля
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const R=rng(11),GY=-0.31,anim=[];
const gnd=new T.Mesh(new T.PlaneGeometry(160,160),new T.MeshLambertMaterial({color:0x8fa3bd,emissive:0x16213a}));gnd.rotation.x=-Math.PI/2;gnd.position.y=GY;scene.add(gnd);
const cabins=[[6.8,4.8,-0.5],[-6.8,5.2,0.5],[-5,-7,3.4],[5.5,-7.2,2.8]],flames=[],fireLights=[];
for(const[cx,cz,ry]of cabins){const g=new T.Group();
  g.add(box(1.5,0.9,1.1,M(0x6b4a32),0,GY+0.45,0));
  const roof=new T.Mesh(new T.ConeGeometry(1.15,0.7,4),M(0x2f2420));roof.rotation.y=Math.PI/4;roof.position.set(0,GY+1.25,0);roof.scale.set(1.15,1,0.85);g.add(roof);g.add(box(0.18,0.45,0.18,M(0x3a2f2a),0.45,GY+1.2,-0.15));
  const wm=new T.MeshBasicMaterial({color:0xffcf70});
  for(const wx of[-0.4,0.4]){const w=new T.Mesh(new T.PlaneGeometry(0.28,0.28),wm);w.position.set(wx,GY+0.5,0.56);g.add(w)}
  const fx=0,fz=1.9;
  const logM=M(0x4a3020),stM=M(0x6a7482);
  for(let i=0;i<3;i++){const lg2=new T.Mesh(new T.CylinderGeometry(0.04,0.04,0.4,6),logM);lg2.rotation.z=Math.PI/2;lg2.rotation.y=i*1.05;lg2.position.set(fx,GY+0.06,fz);g.add(lg2)}
  for(let i=0;i<8;i++){const a=i*0.785,st=new T.Mesh(new T.SphereGeometry(0.07,6,5),stM);st.position.set(fx+Math.cos(a)*0.3,GY+0.04,fz+Math.sin(a)*0.3);g.add(st)}
  const f1=new T.Mesh(new T.ConeGeometry(0.17,0.5,7),new T.MeshBasicMaterial({color:0xff8a2a}));f1.position.set(fx,GY+0.34,fz);g.add(f1);
  const f2=new T.Mesh(new T.ConeGeometry(0.1,0.34,7),new T.MeshBasicMaterial({color:0xffd75a}));f2.position.set(fx,GY+0.26,fz);g.add(f2);
  flames.push(f1,f2);
  const fl=new T.PointLight(0xff9a40,1.1,8,2);fl.position.set(fx,GY+0.6,fz);g.add(fl);fireLights.push(fl);
  const coats=[0xc4533d,0x3d6fa8,0x5a9a52,0xd9a441];
  for(let i=0;i<3;i++){const a=2.2+i*0.95,px=fx+Math.cos(a)*0.62,pz=fz+Math.sin(a)*0.62;
    const p=new T.Group();
    const body=new T.Mesh(new T.CylinderGeometry(0.06,0.1,0.28,8),M(coats[(i+cabins.length)%4]));body.position.y=GY+0.14;p.add(body);
    const head=new T.Mesh(new T.SphereGeometry(0.075,10,8),M(0xf0c8a0));head.position.y=GY+0.36;p.add(head);
    const hat=new T.Mesh(new T.ConeGeometry(0.085,0.13,8),M(coats[(i+2)%4]));hat.position.y=GY+0.47;p.add(hat);
    p.position.set(px,0,pz);g.add(p)}
  g.position.set(cx,0,cz);g.rotation.y=ry;scene.add(g)}
const CNT=520,layers=[[0.9,1.1,0.75],[0.7,1.0,1.45],[0.5,0.9,2.05]];
const lm=layers.map(([r,h])=>new T.InstancedMesh(new T.ConeGeometry(r,h,7),new T.MeshLambertMaterial({color:0xffffff}),CNT));
const tm=new T.InstancedMesh(new T.CylinderGeometry(0.09,0.12,0.5,5),new T.MeshLambertMaterial({color:0x4a3626}),CNT);
{const d=new T.Object3D(),col=new T.Color();let n=0,tries=0;
 while(n<CNT&&tries++<5000){
  const ang=R()*6.2832,rad=6.4+Math.pow(R(),0.85)*16,x=Math.cos(ang)*rad,z=Math.sin(ang)*rad;
  if(cabins.some(c=>Math.hypot(c[0]-x,c[1]-z)<3.6)||Math.abs(rad-12)<1.3||Math.hypot(x+17,z+4)<4.2||Math.hypot(x+9,z+4.5)<1.6)continue;
  const s=0.7+R()*0.6+(rad>12?0.3:0);
  d.rotation.set(0,R()*6,0);d.scale.set(s,s,s);d.position.set(x,GY+0.25*s,z);d.updateMatrix();tm.setMatrixAt(n,d.matrix);
  const hue=0.38+R()*0.06,lt=0.12+R()*0.07;
  layers.forEach((l,k)=>{d.position.set(x,GY+l[2]*s,z);d.updateMatrix();lm[k].setMatrixAt(n,d.matrix);col.setHSL(hue,0.45,lt+(k===2?0.14:k===1?0.05:0));lm[k].setColorAt(n,col)});
  n++}
 for(const m of lm){m.frustumCulled=false;m.count=n;m.instanceMatrix.needsUpdate=true;if(m.instanceColor)m.instanceColor.needsUpdate=true;scene.add(m)}
 tm.frustumCulled=false;tm.count=n;tm.instanceMatrix.needsUpdate=true;scene.add(tm)}
const au={time:{value:0}};
const aurora=new T.Mesh(new T.CylinderGeometry(22,22,24,128,1,true),new T.ShaderMaterial({uniforms:au,transparent:true,depthWrite:false,blending:T.AdditiveBlending,side:T.DoubleSide,
 vertexShader:'uniform float time;varying vec2 vUv;void main(){vUv=uv;vec3 p=position;float w=sin(uv.x*25.0+time*0.5)*1.2+sin(uv.x*9.0-time*0.3)*2.0;p.x+=w*normal.x;p.z+=w*normal.z;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);}',
 fragmentShader:'uniform float time;varying vec2 vUv;void main(){float a=vUv.x*6.2832;float cur=0.5+0.5*sin(a*3.0+sin(time*0.15+a)*2.0);cur=pow(cur,1.5);float rays=0.65+0.35*sin(a*60.0+time*0.7+sin(a*7.0)*3.0);float v=smoothstep(0.0,0.12,vUv.y)*pow(1.0-vUv.y,1.6);vec3 g=vec3(0.15,1.0,0.55);vec3 p=vec3(0.55,0.3,1.0);vec3 b=vec3(0.1,0.8,0.9);vec3 c=mix(mix(g,b,smoothstep(0.1,0.5,vUv.y)),p,smoothstep(0.5,0.95,vUv.y));gl_FragColor=vec4(c,cur*rays*v*0.95);}'}));
aurora.position.y=GY+12;scene.add(aurora);
{const sp=new Float32Array(900);for(let i=0;i<300;i++){const a=R()*6.2832,e=0.12+R()*1.3,r=95;sp[i*3]=Math.cos(a)*Math.cos(e)*r;sp[i*3+1]=Math.sin(e)*r;sp[i*3+2]=Math.sin(a)*Math.cos(e)*r}
 const sg=new T.BufferGeometry();sg.setAttribute('position',new T.BufferAttribute(sp,3));scene.add(new T.Points(sg,new T.PointsMaterial({color:0xffffff,size:1.8,sizeAttenuation:false,fog:false})))}
const moon=new T.Mesh(new T.SphereGeometry(3,16,12),new T.MeshBasicMaterial({color:0xeef3ff,fog:false}));moon.position.set(-45,55,-60);scene.add(moon);

<script>

const isWait=()=>{const m=S&&S.players.find(p=>p.id===S.me);return !!(m&&m.done)};
const spTotal=()=>sps.filter(x=>x.used).length;

function tileSVG(t){const e=t.e,P=[[50,0],[100,50],[50,100],[0,50]];
  const paths=ty=>{const ix=[0,1,2,3].filter(d=>e[d]===ty);
    if(ix.length===2&&(ix[1]-ix[0])%2===1)return [`M${P[ix[0]]} Q50 50 ${P[ix[1]]}`];
    return ix.map(d=>`M50 50L${P[d]}`)};
  const R=paths(1),L=paths(2);let s='<svg viewBox="0 0 100 100" fill="none">';
  s+=L.map(p=>`<path d="${p}" stroke="#111" stroke-width="3"/><path d="${p}" stroke="#111" stroke-width="16" stroke-dasharray="2.5 7"/>`).join('');
  s+=R.map(p=>`<path d="${p}" stroke="#222" stroke-width="24"/>`).join('');
  s+=R.map(p=>`<path d="${p}" stroke="#eaf2f9" stroke-width="20"/>`).join('');
  s+=R.map(p=>`<path d="${p}" stroke="#222" stroke-width="2" stroke-dasharray="7 6"/>`).join('');
  if(e.includes(1)&&e.includes(2)&&!G.isOver(t))s+='<rect x="38" y="38" width="24" height="24" fill="#111"/>';
  return s+'</svg>'}

function onState(s){S=s;
  if(s.phase==='lobby'){show('lobby');$('lc').textContent=s.code;
    $('lp').innerHTML=s.players.map(p=>`<span>${esc(p.name)}${p.id===s.host?' ★':''}</span>`).join('');
    const h=s.host===s.me;$('st').style.display=h?'block':'none';$('lw').textContent=h?'Когда все зашли, нажмите «Начать игру».':'Ждём, пока создатель начнёт игру.';return}
  if(s.phase==='end'){show('end');
    const r=s.results,tie=r.length>1&&r[0].sc.total===r[1].sc.total&&r[0].sc.errors===r[1].sc.errors;

      r.map((p,i)=>`<tr class="${p.id===s.me?'me':''}"><td>${i+1}. ${esc(p.name)}</td><td>${p.sc.nets}</td><td>${p.sc.road}</td><td>${p.sc.rail}</td><td>${p.sc.center}</td><td>−${p.sc.errors}</td><td>${p.sc.total}</td></tr>`).join('');

  const wait=isWait(),host=S.host===S.me;
  $('rd').textContent='Раунд '+S.round+' из 7';
  $('pl').innerHTML=S.players.map(p=>`<span class="${p.done?'dn':''}">${esc(p.name)}${p.done?' ✓':''}</span>`).join('');

    B3.update({board,hints:hs,ghost:gh,tile:gh!=null?gt:null,ok:gh!=null&&G.check(board,(gh/N)|0,gh%N,gt)})}

      let cl='c'+(r===0?' bt':'')+(r===N-1?' bb':'')+(c===0?' bl':'')+(c===N-1?' br':'')+(r===2&&c>=2&&c<=4?' mt':'')+(r===4&&c>=2&&c<=4?' mb':'')+(c===2&&r>=2&&r<=4?' ml':'')+(c===4&&r>=2&&r<=4?' mr':'');

      if(isG)cl+=G.check(board,r,c,G.cur(sel))?' gok':' gbad';

      else if(R===N+1&&c>=0&&c<N){ty=G.exitAt(N-1,c,2);sym=[1,0,0,0]}
      else if(C===0&&r>=0&&r<N){ty=G.exitAt(r,0,3);sym=[0,1,0,0]}
      else if(C===N+1&&r>=0&&r<N){ty=G.exitAt(r,N-1,1);sym=[0,0,0,1]}
      h+=`<div class="x">${ty?tileSVG({e:sym.map(v=>v&&ty),st:0}).replace('</svg>','<polygon points="50,22 76,50 50,78 24,50" fill="#c4533d"/></svg>'):''}</div>`}}
  if(!B3)$('board').innerHTML=h;
  $('tray').innerHTML=dice.map((d,i)=>`<button class="d${d===sel?' sel':''}${d.used?' used':''}" data-d="${i}">${tileSVG(G.cur(d))}</button>`).join('');
  $('spl').textContent=`Особые фишки: осталось ${3-spTotal()} из 3, не больше одной за раунд${spRound?' (в этом раунде уже использована)':''}`;
  $('sp').innerHTML=sps.map((d,i)=>`<button class="d${d===sel?' sel':''}${d.used?' used':''}" data-s="${i}">${tileSVG(G.cur(d))}</button>`).join('');
  const s=G.score(board),all=dice.every(d=>d.used),stuck=!all&&dice.filter(d=>!d.used).every(d=>!G.canPlace(board,d));

  $('skip').style.display=host?'block':'none';
  $('endrow').style.display=host?'flex':'none';
  if(!wait&&stuck&&!$('msg').textContent)say('Оставшиеся фишки разместить нельзя. Подтвердите раунд.')}

// Звуки: настоящие записи (sounds/fire.mp3, wind.mp3, click.mp3)
const SND=(()=>{let ac=null,master=null,on=true,started=false;const buf={},src={};
 try{on=localStorage.getItem('snd')!=='0'}catch(_){}
 const btn=document.createElement('button');btn.setAttribute('aria-label','Звук');
 btn.style.cssText='position:fixed;left:10px;bottom:10px;z-index:50;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,18,40,.75);color:#fff;font-size:20px;cursor:pointer';
 const paint=()=>{btn.textContent=on?'🔊':'🔇'};paint();
 async function loadOne(n){try{const ab=await (await fetch('sounds/'+n+'.mp3')).arrayBuffer();buf[n]=await new Promise((ok,no)=>ac.decodeAudioData(ab,ok,no))}catch(_){}}
 function loop(n,vol){if(!buf[n]||src[n])return;const s=ac.createBufferSource();s.buffer=buf[n];s.loop=true;const g=ac.createGain();g.gain.value=vol;s.connect(g);g.connect(master);s.start();src[n]=s}
 async function start(){if(started||!on)return;started=true;
  try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;ac=new C();master=ac.createGain();master.gain.value=1;master.connect(ac.destination);
   await Promise.all(['wind','fire','click'].map(loadOne));if(on){loop('wind',0.55);loop('fire',0.35)}}catch(_){}}
 function click(){if(!on||!ac||!buf.click)return;try{const s=ac.createBufferSource();s.buffer=buf.click;const g=ac.createGain();g.gain.value=0.9;s.connect(g);g.connect(master);s.start()}catch(_){}}
 btn.onclick=()=>{on=!on;try{localStorage.setItem('snd',on?'1':'0')}catch(_){}paint();
  if(on){if(!started)start();else if(ac){ac.resume();loop('wind',0.55);loop('fire',0.35)}}
  else if(ac){for(const k in src){try{src[k].stop()}catch(_){}delete src[k]}}};
 addEventListener('pointerdown',()=>{if(on){if(!started)start();else if(ac&&ac.state==='suspended')ac.resume()}});
 document.addEventListener('visibilitychange',()=>{if(!ac)return;if(document.hidden)ac.suspend();else if(on)ac.resume()});
 document.body.appendChild(btn);
 return{click}})();
function cellTap(i){if(!sel||isWait())return;const d=sel;if(d.used)return say('Эта фишка уже на поле. Выберите другую.');
  if(board[i])return say('Клетка занята.');
  if(ghost===i)d.rot=(d.rot+1)%4;else ghost=i;
  say(G.check(board,(i/N)|0,i%N,G.cur(d))?'Подходит. Нажмите «Поставить» или крутите дальше (нажатие на фишку).':'Здесь не подходит: поверните или отразите фишку, либо выберите другую клетку.');render()}
$('board').onclick=e=>{const el=e.target.closest('[data-i]');if(el)cellTap(+el.dataset.i)};
if(B3)B3.onTap=cellTap;
$('place').onclick=()=>{const d=sel;if(isWait()||!d||d.used||ghost==null||board[ghost])return;const i=ghost,t=G.cur(d);
  if(!G.check(board,(i/N)|0,i%N,t))return say('Сюда нельзя: фишка должна соединяться с выходом или другим путём, а дорога не стыкуется с рельсами без станции.');
  snaps.push({b:board.slice(),u:dice.map(x=>x.used),su:sps.map(x=>x.used),sr:spRound,s:sel});
  t.n=S.round;board[i]=t;d.used=true;SND.click();if(d.sp)spRound=true;ghost=null;sel=dice.find(x=>!x.used)||null;say('');render()};
$('tray').onclick=e=>{const b=e.target.closest('[data-d]');if(!b||isWait())return;const n=dice[+b.dataset.d];if(n===sel&&!n.used)n.rot=(n.rot+1)%4;sel=n;say('');render()};
$('sp').onclick=e=>{const b=e.target.closest('[data-s]');if(!b||isWait())return;const d=sps[+b.dataset.s];
  if(d.used)return say('Эта особая фишка уже использована.');
  if(spTotal()>=3)return say('Особые фишки закончились: за партию можно три.');
  if(spRound)return say('В этом раунде особая фишка уже использована.');
  sel=d;say('');render()};
$('rot').onclick=()=>{if(sel&&!sel.used){sel.rot=(sel.rot+1)%4;render()}};
$('flip').onclick=()=>{if(sel&&!sel.used){sel.flip=!sel.flip;render()}};
$('undo').onclick=()=>{ghost=null;const s=snaps.pop();if(!s)return;board=s.b;dice.forEach((d,i)=>d.used=s.u[i]);sps.forEach((d,i)=>d.used=s.su[i]);spRound=s.sr;sel=s.s;say('');render()};
$('next').onclick=async()=>{ghost=null;try{await api('confirm',{code:S.code,board,spUsed:sps.map(x=>!!x.used)})}catch(e){say(e.message)}};
$('skip').onclick=()=>api('skip',{code:S.code}).catch(e=>say(e.message));
$('endm').onclick=()=>{const go=()=>api('end',{code:S.code}).catch(e=>say(e.message)),t='Завершить матч для всех игроков? Будут посчитаны очки по подтверждённым ходам.';
  if(tg&&tg.initData&&tg.showConfirm)tg.showConfirm(t,ok=>{if(ok)go()});else if(confirm(t))go()};
$('mk').onclick=async()=>{try{connect((await api('room')).code)}catch(e){$('err').textContent=e.message}};
$('jn').onclick=()=>enter($('cd').value.trim().toUpperCase());
$('st').onclick=()=>api('start',{code:S.code}).catch(e=>$('lw').textContent=e.message);
$('inv').onclick=()=>{
  const link=CFG.bot?'https://t.me/'+CFG.bot+'?start='+S.code:location.origin+'/?room='+S.code,text='Сыграем в «Рельсы и дороги»! Код комнаты: '+S.code;
  if(tg&&tg.openTelegramLink&&CFG.bot)tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(text));
  else if(navigator.clipboard){navigator.clipboard.writeText(link);$('lw').textContent='Ссылка скопирована.'}};
$('again').onclick=()=>{if(es)es.close();S=null;show('home')};
$('tbl').innerHTML=PTS.slice(2).map((p,i)=>`<b style="border-right:1px solid #9db4c7;padding:3px 0">${i+2}</b>`).join('')+PTS.slice(2).map(p=>`<span style="border-right:1px solid #9db4c7;border-top:1px solid #9db4c7;padding:3px 0">${p}</span>`).join('');
fetch('/api/config').then(r=>r.json()).then(c=>CFG=c).catch(()=>{});
let c0=q.get('room');if(!c0){try{c0=localStorage.ri}catch(e){}}
if(c0)enter(c0.toUpperCase());else show('home');
</script></body></html>
